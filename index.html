        content="width=device-width, initial-scale=1.0"

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="canonical"
        href="https://rkaw0619.github.io/rkaw_blog/"
    >

    <!-- OGP -->
    <meta
        property="og:title"
        content="Kawanabe Notion Blog"
    >

    <meta
        property="og:description"
        content="音楽、情報科学、プログラミングなどについて書いているブログです。"
    >

    <meta
        property="og:type"
        content="website"
    >

        content="https://rkaw0619.github.io/rkaw_blog/"
    >

    <meta
        name="twitter:card"
        content="summary"
    >

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;
            background: #ffffff;
        }

        .page-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .notion-frame {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .fallback {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: #ffffff;
            text-align: center;
        }

        .fallback-content {
            max-width: 600px;
        }

        .fallback h1 {
            margin-top: 0;
            font-size: 28px;
        }

        .fallback p {
            line-height: 1.7;
        }

        .fallback a {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 20px;
            border-radius: 8px;
            background: #111111;
            color: #ffffff;
            text-decoration: none;
        }

        .fallback a:hover {
            opacity: 0.85;
        }

        .seo-content {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>

<body>
    <div class="page-container">
        <iframe
            id="notionFrame"
            class="notion-frame"
            src="https://zonokaw.notion.site/ebd//fb1a924d564b83d4900481ba6c0245f6"
            title="Kawanabe Notion Blog"
            allowfullscreen
            loading="eager">
        </iframe>

        <div
            id="fallback"
            class="fallback"
            role="alert"
        >
            <div class="fallback-content">
                <h1>Kawanabe Notion Blog</h1>

                <p>
                    ブログを読み込めませんでした。
                    下のリンクからNotion版のブログを開いてください。
                </p>

                <a
                    href="https://zonokaw.notion.site/Kawanabe-Notion-Blog-fb1a924d564b83d4900481ba6c0245f6"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ブログを開く
                </a>
            </div>
        </div>

        <!--
            検索エンジン向けの最低限のテキスト。
            iframe内のNotion本文とは別ページとして扱われる可能性があるため、
            通常リンクも設置している。
        -->
        <div class="seo-content">
            <h1>Kawanabe Notion Blog</h1>

            <p>
                音楽、情報科学、プログラミングなどについて書いているブログです。
            </p>

            <a href="https://zonokaw.notion.site/Kawanabe-Notion-Blog-fb1a924d564b83d4900481ba6c0245f6">
                Kawanabe Notion Blog
            </a>
        </div>
    </div>

    <script>
        const notionFrame = document.getElementById("notionFrame");
        const fallback = document.getElementById("fallback");

        // iframe自体の読み込みエラー時のみ代替表示する
        notionFrame.addEventListener("error", () => {
            notionFrame.style.display = "none";
            fallback.style.display = "flex";
        });
    </script>
</body>
</html>
